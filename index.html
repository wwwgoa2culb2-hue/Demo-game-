<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WinGo Game</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }
        .container {
            width: 100%;
            max-width: 420px;
            background-color: #1e293b;
            padding: 16px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        .header {
            text-align: center;
            padding-bottom: 12px;
            border-bottom: 1px solid #334155;
            margin-bottom: 16px;
        }
        .header h2 {
            color: #38bdf8;
            font-size: 22px;
        }
        .game-card {
            background: #0f172a;
            border-radius: 10px;
            padding: 16px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
            border: 1px solid #334155;
        }
        .period-info h4 {
            color: #94a3b8;
            font-size: 14px;
        }
        .period-info p {
            font-size: 18px;
            font-weight: bold;
            color: #f8fafc;
            margin-top: 4px;
        }
        .timer-info h4 {
            color: #94a3b8;
            font-size: 14px;
            text-align: right;
        }
        .timer-box {
            font-size: 24px;
            font-weight: bold;
            color: #ef4444;
            margin-top: 4px;
            text-align: right;
        }
        .bet-buttons {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            margin-bottom: 16px;
        }
        .btn-green { background-color: #22c55e; color: white; }
        .btn-violet { background-color: #8b5cf6; color: white; }
        .btn-red { background-color: #ef4444; color: white; }
        .btn {
            flex: 1;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 15px;
            cursor: pointer;
        }
        .numbers-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 10px;
            margin-bottom: 16px;
        }
        .num-btn {
            background-color: #334155;
            color: white;
            border: 1px solid #475569;
            padding: 12px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .big-small {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .btn-big { background-color: #eab308; color: #000; flex: 1; font-weight: bold; padding: 12px; border-radius: 8px; border: none; cursor: pointer; }
        .btn-small { background-color: #3b82f6; color: white; flex: 1; font-weight: bold; padding: 12px; border-radius: 8px; border: none; cursor: pointer; }
        
        .history-table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }
        .history-table th, .history-table td {
            padding: 8px;
            text-align: center;
            border-bottom: 1px solid #334155;
            font-size: 14px;
        }
        .history-table th {
            color: #94a3b8;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2>WinGo 1 Min</h2>
    </div>

    <div class="game-card">
        <div class="period-info">
            <h4>Period Number</h4>
            <p id="period">20261012001</p>
        </div>
        <div class="timer-info">
            <h4>Time Remaining</h4>
            <div class="timer-box" id="timer">00:30</div>
        </div>
    </div>

    <div class="bet-buttons">
        <button class="btn btn-green">Green</button>
        <button class="btn btn-violet">Violet</button>
        <button class="btn btn-red">Red</button>
    </div>

    <div class="numbers-grid">
        <button class="num-btn">0</button>
        <button class="num-btn">1</button>
        <button class="num-btn">2</button>
        <button class="num-btn">3</button>
        <button class="num-btn">4</button>
        <button class="num-btn">5</button>
        <button class="num-btn">6</button>
        <button class="num-btn">7</button>
        <button class="num-btn">8</button>
        <button class="num-btn">9</button>
    </div>

    <div class="big-small">
        <button class="btn-big">Big</button>
        <button class="btn-small">Small</button>
    </div>

    <h3 style="margin-bottom: 10px; font-size: 16px; color: #94a3b8;">Game History</h3>
    <table class="history-table">
        <thead>
            <tr>
                <th>Period</th>
                <th>Number</th>
                <th>Big/Small</th>
                <th>Color</th>
            </tr>
        </thead>
        <tbody id="historyBody">
            <tr>
                <td>20261012000</td>
                <td>7</td>
                <td style="color: #eab308;">Big</td>
                <td style="color: #22c55e;">Green</td>
            </tr>
        </tbody>
    </table>
</div>

<script>
    let timeLeft = 30;
    let periodNum = 20261012001;

    function updateTimer() {
        let seconds = timeLeft < 10 ? "0" + timeLeft : timeLeft;
        document.getElementById("timer").innerText = "00:" + seconds;
        
        if (timeLeft === 0) {
            timeLeft = 30;
            periodNum++;
            document.getElementById("period").innerText = periodNum;
            addNewHistory();
        } else {
            timeLeft--;
        }
    }

    function addNewHistory() {
        let randomNum = Math.floor(Math.random() * 10);
        let bigSmall = randomNum >= 5 ? "Big" : "Small";
        let color = randomNum % 2 === 0 ? "Red" : "Green";
        
        let historyBody = document.getElementById("historyBody");
        let newRow = `
            <tr>
                <td>${periodNum - 1}</td>
                <td>${randomNum}</td>
                <td>${bigSmall}</td>
                <td style="color: ${color === 'Red' ? '#ef4444' : '#22c55e'}">${color}</td>
            </tr>
        `;
        historyBody.insertAdjacentHTML('afterbegin', newRow);
    }

    setInterval(updateTimer, 1000);
</script>

</body>
</html>
