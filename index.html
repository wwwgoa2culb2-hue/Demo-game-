<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Daman WinGo Demo Game</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #f1f3f6; color: #333; display: flex; flex-direction: column; align-items: center; padding-bottom: 50px; }
        
        /* Top Header */
        .header { background: linear-gradient(135deg, #ff4d4d, #f9cb28); width: 100%; max-width: 420px; padding: 12px 15px; color: white; display: flex; justify-content: space-between; align-items: center; font-size: 18px; font-weight: bold; }
        
        .game-container { width: 100%; max-width: 420px; background: #fff; padding: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); }

        /* Wallet Box */
        .wallet-card { background: #fff5f5; border: 1px solid #ffcccc; border-radius: 10px; padding: 12px; text-align: center; margin-bottom: 12px; }
        .wallet-title { font-size: 12px; color: #777; }
        .wallet-bal { font-size: 22px; font-weight: bold; color: #e74c3c; margin: 4px 0; }
        .wallet-info { font-size: 11px; color: #888; }

        /* Timer Card */
        .timer-card { background: linear-gradient(135deg, #ff5e62, #ff9966); border-radius: 10px; padding: 15px; color: white; display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
        .timer-left h3 { font-size: 14px; margin-bottom: 5px; }
        .timer-right { text-align: right; }
        .timer-digits { font-size: 22px; font-weight: bold; background: rgba(0,0,0,0.15); padding: 4px 10px; border-radius: 6px; letter-spacing: 2px; }
        .period-text { font-size: 10px; margin-top: 4px; opacity: 0.9; }

        /* Color Action Buttons */
        .color-row { display: flex; gap: 8px; margin-bottom: 12px; }
        .btn-color { flex: 1; padding: 10px; border: none; border-radius: 6px; color: white; font-weight: bold; font-size: 14px; cursor: pointer; }
        .bg-green { background-color: #27ae60; }
        .bg-violet { background-color: #9b59b6; }
        .bg-red { background-color: #e74c3c; }

        /* Number Grid 0-9 */
        .number-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; background: #f8f9fa; padding: 10px; border-radius: 10px; margin-bottom: 12px; }
        .num-circle { width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: white; font-size: 18px; font-weight: bold; justify-self: center; cursor: pointer; box-shadow: 0 2px 5px rgba(0,0,0,0.15); }
        .c-0 { background: linear-gradient(135deg, #9b59b6 50%, #e74c3c 50%); }
        .c-5 { background: linear-gradient(135deg, #9b59b6 50%, #27ae60 50%); }

        /* Big / Small Buttons */
        .bs-row { display: flex; gap: 10px; margin-bottom: 15px; }
        .btn-bs { flex: 1; padding: 12px; border: none; border-radius: 8px; color: white; font-weight: bold; font-size: 16px; cursor: pointer; }
        .btn-big { background-color: #f39c12; }
        .btn-small { background-color: #3498db; }

        /* History Table */
        .history-box { margin-top: 15px; }
        .history-title { font-size: 14px; font-weight: bold; color: #e74c3c; margin-bottom: 8px; border-bottom: 2px solid #e74c3c; padding-bottom: 4px; }
        table { width: 100%; border-collapse: collapse; text-align: center; font-size: 12px; }
        th { background: #e74c3c; color: white; padding: 6px; }
        td { padding: 6px; border-bottom: 1px solid #eee; }

        /* Admin Control Panel */
        .admin-box { width: 100%; max-width: 420px; background: #1e293b; color: white; padding: 15px; border-radius: 10px; margin-top: 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.2); }
        .admin-box h3 { color: #f39c12; font-size: 15px; margin-bottom: 10px; border-bottom: 1px solid #334155; padding-bottom: 5px; }
        .admin-group { margin-bottom: 10px; }
        .admin-group label { display: block; font-size: 12px; color: #cbd5e1; margin-bottom: 3px; }
        .admin-group select, .admin-group input { width: 100%; padding: 8px; background: #0f172a; color: white; border: 1px solid #475569; border-radius: 5px; font-size: 13px; }
        .admin-btn { width: 100%; padding: 10px; background: #f39c12; color: #000; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="header">
        <span>&larr;</span>
        <span>Daman WinGo 30s (Demo)</span>
        <span>&#127918;</span>
    </div>

    <div class="game-container">
        <!-- Demo Wallet -->
        <div class="wallet-card">
            <div class="wallet-title">Practice Wallet Balance</div>
            <div class="wallet-bal">₹<span id="balance">1000.00</span></div>
            <div class="wallet-info">No Real Deposit / No Real Withdrawal</div>
        </div>

        <!-- Timer Card -->
        <div class="timer-card">
            <div class="timer-left">
                <h3>WinGo 30Sec</h3>
                <p style="font-size:11px; opacity:0.9;">Place your bet</p>
            </div>
            <div class="timer-right">
                <div class="timer-digits" id="timer">00:30</div>
                <div class="period-text" id="period-no">2026101201</div>
            </div>
        </div>

        <!-- Color Buttons -->
        <div class="color-row">
            <button class="btn-color bg-green" onclick="playBet('Green')">Green</button>
            <button class="btn-color bg-violet" onclick="playBet('Violet')">Violet</button>
            <button class="btn-color bg-red" onclick="playBet('Red')">Red</button>
        </div>

        <!-- Number Balls 0-9 -->
        <div class="number-grid">
            <div class="num-circle c-0" onclick="playBet('0')">0</div>
            <div class="num-circle bg-green" onclick="playBet('1')">1</div>
            <div class="num-circle bg-red" onclick="playBet('2')">2</div>
            <div class="num-circle bg-green" onclick="playBet('3')">3</div>
            <div class="num-circle bg-red" onclick="playBet('4')">4</div>
            <div class="num-circle c-5" onclick="playBet('5')">5</div>
            <div class="num-circle bg-red" onclick="playBet('6')">6</div>
            <div class="num-circle bg-green" onclick="playBet('7')">7</div>
            <div class="num-circle bg-red" onclick="playBet('8')">8</div>
            <div class="num-circle bg-green" onclick="playBet('9')">9</div>
        </div>

        <!-- Big Small -->
        <div class="bs-row">
            <button class="btn-bs btn-big" onclick="playBet('Big')">Big</button>
            <button class="btn-bs btn-small" onclick="playBet('Small')">Small</button>
        </div>

        <!-- History -->
        <div class="history-box">
            <div class="history-title">Game History</div>
            <table>
                <thead>
                    <tr>
                        <th>Period</th>
                        <th>Number</th>
                        <th>Size</th>
                        <th>Color</th>
                    </tr>
                </thead>
                <tbody id="history-body">
                    <!-- History rows -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Admin Panel -->
    <div class="admin-box">
        <h3>⚙️ Admin Control Panel</h3>
        <div class="admin-group">
            <label>Next Result Color Override:</label>
            <select id="admin-color">
                <option value="Auto">Auto (Random)</option>
                <option value="Green">Force Green</option>
                <option value="Violet">Force Violet</option>
                <option value="Red">Force Red</option>
            </select>
        </div>
        <div class="admin-group">
            <label>Next Result Number Override (0-9):</label>
            <input type="number" id="admin-num" min="0" max="9" placeholder="Leave blank for random">
        </div>
        <button class="admin-btn" onclick="saveAdmin()">Set Next Result</button>
    </div>

    <script>
        let balance = 1000.00;
        let timeLeft = 30;
        let period = 2026101201;

        let forceCol = "Auto";
        let forceNum = "";

        let historyList = [
            { period: 2026101200, num: 3, size: "Small", color: "Green" },
            { period: 2026101200, num: 8, size: "Big", color: "Red" },
            { period: 2026101200, num: 0, size: "Small", color: "Violet" }
        ];

        function renderHistory() {
            let tbody = document.getElementById('history-body');
            tbody.innerHTML = '';
            historyList.forEach(item => {
                let colHex = item.color === 'Green' ? '#27ae60' : item.color === 'Red' ? '#e74c3c' : '#9b59b6';
                let tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${item.period}</td>
                    <td style="color:${colHex}; font-weight:bold; font-size:14px;">${item.num}</td>
                    <td>${item.size}</td>
                    <td><span style="background:${colHex}; width:10px; height:10px; border-radius:50%; display:inline-block;"></span></td>
                `;
                tbody.appendChild(tr);
            });
        }

        function saveAdmin() {
            forceCol = document.getElementById('admin-color').value;
            forceNum = document.getElementById('admin-num').value;
            alert("Admin settings updated for the next round!");
        }

        function playBet(choice) {
            if (balance >= 10) {
                balance -= 10;
                document.getElementById('balance').innerText = balance.toFixed(2);
                alert(`Demo Bet Placed on: ${choice} (₹10 deducted from practice wallet)`);
            } else {
                alert("Demo balance is over! Refresh page to reset balance.");
            }
        }

        function runTimer() {
            timeLeft--;
            if (timeLeft < 0) {
                timeLeft = 30;
                period++;
                document.getElementById('period-no').innerText = period;

                let finalNum;
                if (forceNum !== "" && !isNaN(forceNum)) {
                    finalNum = parseInt(forceNum);
                } else {
                    finalNum = Math.floor(Math.random() * 10);
                }

                let finalCol;
                if (forceCol !== "Auto") {
                    finalCol = forceCol;
                } else {
                    if ([1,3,7,9].includes(finalNum)) finalCol = "Green";
                    else if ([2,4,6,8].includes(finalNum)) finalCol = "Red";
                    else finalCol = "Violet";
                }

                let finalSize = finalNum >= 5 ? "Big" : "Small";

                historyList.unshift({
                    period: period,
                    num: finalNum,
                    size: finalSize,
                    color: finalCol
                });

                if(historyList.length > 5) historyList.pop();
                renderHistory();

                // Reset admin overrides
                forceCol = "Auto";
                forceNum = "";
                document.getElementById('admin-color').value = "Auto";
                document.getElementById('admin-num').value = "";
            }

            let secStr = timeLeft < 10 ? "0" + timeLeft : timeLeft;
            document.getElementById('timer').innerText = "00:" + secStr;
        }

        renderHistory();
        setInterval(runTimer, 1000);
    </script>
</body>
</html>
